
<mat-toolbar color="primary">
  <span>Product Management</span>
  <span class="spacer"></span>
  <button mat-icon-button (click)="logout()" aria-label="Logout">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="product-list-container">
  <mat-card>
    <mat-card-title>Products</mat-card-title>
    <mat-card-content>
      <table mat-table [dataSource]="products" class="mat-elevation-z2" *ngIf="products.length > 0">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let p">{{p.name}}</td>
        </ng-container>

        <!-- Price Column -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Price</th>
          <td mat-cell *matCellDef="let p">{{p.price | currency:'USD'}}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let p">
            <button mat-icon-button color="accent" (click)="edit(p)" aria-label="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="remove(p.id)" aria-label="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['name', 'price', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['name', 'price', 'actions'];"></tr>
      </table>
      <div *ngIf="products.length === 0" class="empty-state">
        <mat-icon>inventory_2</mat-icon>
        <span>No products found.</span>
      </div>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="editing = { id: 0, name: '', price: 0 }">
        <mat-icon>add</mat-icon> Create New
      </button>
    </mat-card-actions>
  </mat-card>

  <app-product-form *ngIf="editing !== null" [product]="editing || {}" (save)="save($event)"></app-product-form>
</div>

<style>
  .spacer { flex: 1 1 auto; }
  .product-list-container { margin: 2rem auto; max-width: 800px; }
  .empty-state { display: flex; align-items: center; gap: 8px; color: #888; margin: 2rem 0; }
</style>
