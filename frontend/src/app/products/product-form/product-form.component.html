
<form (ngSubmit)="submit()" #form="ngForm" class="product-form">
	<mat-card>
		<mat-card-title>{{product.id ? 'Edit Product' : 'Create Product'}}</mat-card-title>
		<mat-card-content>
			<div class="form-fields">
				<mat-form-field appearance="outline">
					<mat-label>Name</mat-label>
					<input matInput [(ngModel)]="product.name" name="name" required />
				</mat-form-field>


				<mat-form-field appearance="outline">
					<mat-label>Price</mat-label>
					  <input matInput type="text" [ngModel]="priceMasked" (ngModelChange)="onPriceInput($event)" name="price" required pattern="^\d+(,\d{1,2})?$" placeholder="Ex: 99,99" />
				</mat-form-field>
			</div>
		</mat-card-content>
		<mat-card-actions>
			<button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
				<mat-icon>save</mat-icon> Save
			</button>
			<button mat-button type="button" (click)="product = {}; $event.stopPropagation();">
				<mat-icon>close</mat-icon> Cancel
			</button>
		</mat-card-actions>
	</mat-card>
	<style>
		.product-form { max-width: 400px; margin: 2rem auto; }
		.form-fields { display: flex; flex-direction: column; gap: 1rem; }
	</style>
</form>
